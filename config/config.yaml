# TrendRadar 配置文件（为 Sam 定制，2026-11-25）
# 来源：TrendRadar v6.12.0 默认 config.yaml，按部署准备调整
# 关键改动说明：
# - report.mode = current（轻量模式没有持久存储，增量模式不可用；见 DEPLOY.md）
# - AI 走 Groq 免费接口（api_base + openai/ 前缀模型名）；key 由环境变量 AI_API_KEY 注入
# - 推送只走飞书群机器人；邮件已取消（email 字段留空）
# - web_search 关闭（需要 DeepSeek key，Sam 没有）
# - filter.method = keyword（关键词文件见 frequency_words.txt，不耗 AI token）

app:
  timezone: "Asia/Shanghai"
  show_version_update: true

# 调度系统关闭：运行节奏由 GitHub Actions 的 cron 控制（每天 08:33 / 14:33 / 20:33 北京时间）
# 每次运行都抓取并推送，不按 timeline 分时段
schedule:
  enabled: false
  preset: "morning_evening"

# 数据源：11 个中文热榜平台（NewsNow API）
platforms:
  enabled: true
  api_url: ""
  sources:
    - id: "toutiao"
      name: "今日头条"
      expected_domain: "toutiao.com"
    - id: "baidu"
      name: "百度热搜"
      expected_domain: "baidu.com"
    - id: "wallstreetcn-hot"
      name: "华尔街见闻"
      expected_domain: "wallstreetcn.com"
    - id: "thepaper"
      name: "澎湃新闻"
      expected_domain: "thepaper.cn"
    - id: "bilibili-hot-search"
      name: "bilibili 热搜"
      expected_domain: "bilibili.com"
    - id: "cls-hot"
      name: "财联社热门"
      expected_domain: "cls.cn"
    - id: "ifeng"
      name: "凤凰网"
      expected_domain: "ifeng.com"
    - id: "tieba"
      name: "贴吧"
      expected_domain: "baidu.com"
    - id: "weibo"
      name: "微博"
      expected_domain: "weibo.com"
    - id: "douyin"
      name: "抖音"
      expected_domain: "douyin.com"
    - id: "zhihu"
      name: "知乎"
      expected_domain: "zhihu.com"

# RSS：只保留 Hacker News 首页和雅虎财经（英文源，翻译后看）
rss:
  enabled: true
  freshness_filter:
    enabled: true
    max_age_days: 1
  feeds:
    - id: "hacker-news"
      name: "Hacker News"
      url: "https://hnrss.org/frontpage"
    - id: "yahoo-finance"
      name: "雅虎财经"
      url: "https://finance.yahoo.com/news/rssindex"

# 联网搜索：关闭（默认搜索引擎是 DeepSeek，需要 DeepSeek key）
web_search:
  enabled: false
  provider: "deepseek"
  queries_file: ""
  query_mode: "direct"
  fetch_count: 20
  max_items_per_topic: 8
  freshness_days: 7
  dedup_days: 7
  min_score: 0.5
  min_authority: -1
  allow_unknown_authority: true
  need_content: false
  notification_show_snippet: false
  providers:
    deepseek:
      api_key: ""
      api_base: "https://api.deepseek.com"
      localization: ""

# 报告模式：current（当前榜单）
# 注意：不要改成 incremental。轻量模式下每次运行都是全新环境、没有上次的状态，
# incremental 无法判断“新增”，官方文档明确写轻量模式无增量推送、无历史追踪。
report:
  mode: "current"
  display_mode: "keyword"
  sort_by_position_first: false
  rank_threshold: 5
  max_news_per_keyword: 0

# 筛选：关键词匹配（frequency_words.txt），不调用 AI
filter:
  method: "keyword"
  priority_sort_enabled: true

ai_filter:
  batch_size: 200
  batch_interval: 2
  min_score: 0.7
  reclassify_threshold: 0.6
  prompt_file: "prompt.txt"
  extract_prompt_file: "extract_prompt.txt"
  update_tags_prompt_file: "update_tags_prompt.txt"

# 推送内容：热榜 + RSS + AI 分析；新增区、独立展示区、联网搜索区关闭
display:
  region_order:
    - new_items
    - hotlist
    - rss
    - web_search
    - standalone
    - ai_analysis
  regions:
    hotlist: true
    new_items: false
    rss: true
    web_search: false
    standalone: false
    ai_analysis: true
  standalone:
    platforms: []
    rss_feeds: []
    max_items: 20

# 推送通知：只启用飞书群机器人
# webhook 地址不要写在这里，由 GitHub Secret FEISHU_WEBHOOK_URL 注入
# 其他渠道全部留空（邮件已取消；Bark 可选，见 DEPLOY.md）
notification:
  enabled: true
  channels:
    feishu:
      webhook_url: ""
    dingtalk:
      webhook_url: ""
    wework:
      webhook_url: ""
      msg_type: "markdown"
    telegram:
      bot_token: ""
      chat_id: ""
    email:
      from: ""
      password: ""
      to: ""
      smtp_server: ""
      smtp_port: ""
    ntfy:
      server_url: "https://ntfy.sh"
      topic: ""
      token: ""
    bark:
      url: ""
    slack:
      webhook_url: ""
    generic_webhook:
      webhook_url: ""
      payload_template: ""

# 存储：auto（无远程存储时走本地）。轻量模式：每次运行的数据不保留，
# 只有 HTML 报告靠工作流里的 commit-back 步骤写回仓库（见 crawler.yml.CHANGES.md）。
# 不配 R2（需要绑卡验证），所以 remote 全部留空。
storage:
  backend: "auto"
  formats:
    sqlite: true
    txt: false
    html: true
  local:
    data_dir: "output"
    retention_days: 0
  remote:
    retention_days: 0
    endpoint_url: ""
    bucket_name: ""
    access_key_id: ""
    secret_access_key: ""
    region: ""
  pull:
    enabled: false
    days: 7

# AI 模型：Groq 免费接口（LiteLLM 的 openai/ 兼容格式）
# api_key 留空，由 GitHub Secret AI_API_KEY 注入；model 和 api_base 写死在这里，
# 空 Secret 不会覆盖配置文件的值（加载器是“环境变量为空时回落到配置文件”）。
ai:
  model: "openai/gpt-oss-120b"
  api_key: ""
  api_base: "https://api.groq.com/openai/v1"
  timeout: 120
  temperature: 1.0
  max_tokens: 5000
  num_retries: 1
  fallback_models: []

# AI 分析：开启，中文报告；缺 key 时优雅跳过（只少分析区，推送其余内容继续）
ai_analysis:
  enabled: true
  language: "Chinese"
  prompt_file: "ai_analysis_prompt.txt"
  mode: "follow_report"
  max_news_for_analysis: 150
  include_rss: false
  include_web_search: false
  search_summary_max_chars: 300
  include_standalone: false
  include_rank_timeline: true

# AI 翻译：开启，只翻译 RSS 标题（热榜本身就是中文，不用翻）
ai_translation:
  enabled: true
  language: "中文"
  prompt_file: "ai_translation_prompt.txt"
  batch_size: 100
  batch_interval: 2
  scope:
    hotlist: false
    rss: true
    web_search: false
    standalone: false

advanced:
  debug: false
  version_check_url: "https://raw.githubusercontent.com/sansan0/TrendRadar/refs/heads/master/version"
  mcp_version_check_url: "https://raw.githubusercontent.com/sansan0/TrendRadar/refs/heads/master/version_mcp"
  configs_version_check_url: "https://raw.githubusercontent.com/sansan0/TrendRadar/refs/heads/master/version_configs"
  crawler:
    request_interval: 2000
    use_proxy: false
    default_proxy: "http://127.0.0.1:10801"
  rss:
    request_interval: 1000
    timeout: 15
    use_proxy: false
    proxy_url: ""
  web_search:
    request_interval: 1000
    timeout: 20
    max_retries: 2
    use_proxy: false
    proxy_url: ""
  weight:
    rank: 0.6
    frequency: 0.3
    hotness: 0.1
  max_accounts_per_channel: 3
  batch_size:
    default: 4000
    dingtalk: 20000
    feishu: 30000
    bark: 4000
    slack: 4000
  batch_send_interval: 3
  feishu_message_separator: "━━━━━━━━━━━━━━━━"
